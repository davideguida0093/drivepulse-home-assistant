name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # The HACS action reads hacs.json and the manifest from raw.githubusercontent.com
    # without a token: on a private repository it cannot, and reports a false
    # failure. Informative while private, strict once public.
    continue-on-error: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The brand images live inside the integration (brand/). Submitting
          # to home-assistant/brands is only needed for the default HACS list.
          ignore: brands
